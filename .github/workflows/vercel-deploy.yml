name: NSA Stock Scanner CI & Vercel Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Verify Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Microstructure Math & Endpoints
        run: |
          python -c "
          from backend.microstructure import calc_corwin_schultz, calc_garman_klass, calc_kyles_lambda, calc_hawkes_intensity, float_turnover_ratio
          print('Microstructure formulas verified.')
          "

      - name: Build Frontend & Assemble Public Distribution
        run: |
          cd frontend
          npm install
          npm run build
          mkdir -p ../public
          cp -r dist/* ../public/

      - name: Verify Distribution Artifacts
        run: |
          test -f public/index.html && echo "✓ public/index.html present"
          test -f public/serenity-widget.html && echo "✓ public/serenity-widget.html present"

  deploy:
    name: Deploy to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel via CLI (if VERCEL_TOKEN secret configured)
        if: "${{ env.VERCEL_TOKEN != '' }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Initiating production deploy with Vercel Token..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
