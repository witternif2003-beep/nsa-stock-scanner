name: Deploy NSA Serenity-Ω Permanent GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Production Assets
        run: |
          cd frontend
          npm install
          npm run build
          mkdir -p ../public
          cp -r dist/* ../public/
          # Ensure index.html and serenity-widget.html exist in public
          test -f ../public/index.html && echo "✓ public/index.html verified"
          test -f ../public/serenity-widget.html && echo "✓ public/serenity-widget.html verified"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
